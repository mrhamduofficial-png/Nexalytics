version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: nexalytics
      POSTGRES_PASSWORD: nexalytics_dev
      POSTGRES_DB: nexalytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexalytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
